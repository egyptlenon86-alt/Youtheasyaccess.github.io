<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LaunchPad NYC — Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --accent: #7C3AED;
  --accent2: #0EA5E9;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --xp-gold: #F59E0B;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="dark"] {
  --bg: #0F0F1A;
  --bg-card: #16162A;
  --bg-elevated: #1E1E35;
  --bg-overlay: #252540;
  --text: #F0EFFF;
  --text-secondary: #9090C0;
  --text-muted: #5A5A8A;
  --border: rgba(140,120,255,0.15);
  --border-strong: rgba(140,120,255,0.3);
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg: #F5F4FF;
  --bg-card: #FFFFFF;
  --bg-elevated: #F0EFFF;
  --bg-overlay: #E8E6FF;
  --text: #1A1A2E;
  --text-secondary: #4A4A7A;
  --text-muted: #8A8AB0;
  --border: rgba(100,80,200,0.15);
  --border-strong: rgba(100,80,200,0.3);
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
  backdrop-filter: blur(12px);
}
.topbar-logo { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; display:flex; gap:6px; align-items:center; }
.logo-mark { width:32px; height:32px; background:var(--accent); border-radius:8px; display:grid; place-items:center; font-size:0.85rem; color:#fff; font-weight:900; }
.topbar-sep { color: var(--text-muted); }
.topbar-title { font-size:0.9rem; color:var(--text-secondary); font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.icon-btn { width:36px; height:36px; border:1px solid var(--border); background:transparent; border-radius:8px; cursor:pointer; display:grid; place-items:center; color:var(--text); transition:.2s; }
.icon-btn:hover { background:var(--bg-elevated); }
.back-btn { display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary); background:transparent; border:none; cursor:pointer; padding:6px 10px; border-radius:8px; transition:.2s; }
.back-btn:hover { background:var(--bg-elevated); color:var(--text); }

/* ── XP AVATAR ── */
.xp-pill {
  display:flex; align-items:center; gap:8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 4px 12px 4px 4px;
  cursor: pointer;
  transition: .2s;
  position: relative;
}
.xp-pill:hover { border-color: var(--xp-gold); }
.avatar-circle {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1rem;
  border: 2px solid var(--xp-gold);
  position: relative;
  transition: .3s;
  overflow: hidden;
  background: var(--bg-overlay);
}
.avatar-circle .avatar-emoji { font-size: 1.2rem; line-height:1; transition: .3s; }
.xp-info { display:flex; flex-direction:column; gap:1px; }
.xp-level { font-size:0.72rem; font-weight:700; color:var(--xp-gold); font-family:var(--font-display); letter-spacing:0.06em; text-transform:uppercase; }
.xp-bar-mini { width: 70px; height: 4px; background: var(--border); border-radius: 99px; overflow:hidden; }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--xp-gold), #FF8C00); border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }

/* ── AVATAR PANEL ── */
.avatar-panel {
  position: fixed; top: 60px; right: 24px; z-index: 200;
  width: 320px; background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: none;
  animation: slideDown .25s ease;
}
.avatar-panel.open { display: block; }
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
.ap-title { font-family: var(--font-display); font-weight:800; font-size:1rem; margin-bottom:16px; }
.ap-avatar-big {
  width: 90px; height: 90px; border-radius: 50%;
  margin: 0 auto 12px;
  display: grid; place-items: center;
  font-size: 3rem;
  background: var(--bg-elevated);
  border: 3px solid var(--xp-gold);
  position: relative;
}
.ap-avatar-ring {
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: conic-gradient(var(--xp-gold) var(--ring-pct, 0%), var(--border) 0%) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
}
.ap-name { text-align:center; font-weight:700; font-size:1rem; }
.ap-level-text { text-align:center; font-size:0.8rem; color:var(--xp-gold); font-weight:700; margin-bottom:12px; text-transform:uppercase; letter-spacing:.06em; }
.ap-xp-bar { width:100%; height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:6px; }
.ap-xp-fill { height:100%; background:linear-gradient(90deg,var(--xp-gold),#FF8C00); border-radius:99px; transition: width .6s; }
.ap-xp-label { font-size:0.75rem; color:var(--text-muted); text-align:right; margin-bottom:16px; }
.ap-unlockables { margin-top:12px; }
.ap-unlock-title { font-size:0.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin-bottom:10px; font-weight:700; }
.ap-skins {
  display: grid; grid-template-columns: repeat(5,1fr); gap: 8px;
}
.ap-skin {
  width:100%; aspect-ratio:1; border-radius:50%; background:var(--bg-elevated);
  display:grid; place-items:center; font-size:1.4rem; cursor:pointer;
  border: 2px solid var(--border);
  transition:.2s; opacity:.4; filter:grayscale(1);
}
.ap-skin.unlocked { opacity:1; filter:none; border-color:var(--border-strong); }
.ap-skin.active { border-color:var(--xp-gold); box-shadow:0 0 0 3px rgba(245,158,11,0.25); }
.ap-skin.unlocked:hover { border-color:var(--accent); }
.ap-unlock-at { font-size:0.65rem; text-align:center; color:var(--text-muted); margin-top:2px; }

/* ── PROGRESS BAR ── */
.lesson-progress-bar {
  height: 4px; background: var(--border);
  position: sticky; top: 57px; z-index: 90;
}
.lesson-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .4s ease; width: 0%;
}

/* ── LAYOUT ── */
.lesson-layout {
  max-width: 900px; margin: 0 auto;
  padding: 32px 24px 80px;
  display: grid; gap: 32px;
}

/* ── LESSON HEADER ── */
.lesson-header {
  display: grid; gap: 12px;
}
.lesson-meta-row {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.lesson-tag {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  padding: 3px 10px; border-radius: 99px;
  background: var(--bg-elevated); color: var(--text-secondary);
  border: 1px solid var(--border);
}
.lesson-tag.cat { background: rgba(124,58,237,0.15); color: var(--accent); border-color: rgba(124,58,237,0.3); }
.lesson-tag.level-beginner { background: rgba(16,185,129,0.15); color: var(--success); border-color: rgba(16,185,129,0.3); }
.lesson-tag.level-intermediate { background: rgba(245,158,11,0.15); color: var(--warning); border-color: rgba(245,158,11,0.3); }
.lesson-title { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; line-height: 1.1; }
.lesson-desc { color: var(--text-secondary); line-height: 1.7; font-size: 1rem; }
.lesson-stats { display:flex; gap:20px; flex-wrap:wrap; }
.lesson-stat { display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-muted); }
.lesson-stat strong { color: var(--text); font-weight:600; }

/* ── SECTION CARDS ── */
.section-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: .2s;
}
.section-card:hover { border-color: var(--border-strong); }
.section-header {
  padding: 20px 24px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.section-icon { font-size: 1.3rem; }
.section-label { font-family: var(--font-display); font-weight: 700; font-size: 1rem; flex: 1; }
.section-badge { font-size: 0.72rem; background: var(--bg-elevated); padding: 2px 8px; border-radius: 99px; color: var(--text-muted); }
.section-body { padding: 24px; }
.section-body.collapsed { display: none; }

/* ── VIDEO PLAYER ── */
.video-container {
  position: relative; width: 100%; border-radius: var(--radius-sm); overflow: hidden;
  background: #000; aspect-ratio: 16/9;
}
.video-container iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
.video-thumbnail {
  position: absolute; inset: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-elevated);
}
.video-thumbnail img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; opacity:.7; }
.play-btn {
  position: relative; z-index: 2;
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--accent); display: grid; place-items: center;
  box-shadow: 0 4px 24px rgba(124,58,237,0.5);
  transition: .2s; cursor: pointer;
}
.play-btn:hover { transform: scale(1.08); background: #6B21E0; }
.play-btn svg { color: white; }
.video-label { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); }

/* ── ANIMATION EXPLAINER ── */
.anim-stage {
  background: var(--bg-elevated); border-radius: var(--radius-sm);
  padding: 24px; min-height: 220px;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.anim-controls { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
.anim-btn {
  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text);
  transition: .2s;
}
.anim-btn:hover, .anim-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.anim-step-label { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; font-family: var(--font-mono); }

/* Resume animation pieces */
.resume-doc {
  width: 180px; background: var(--bg-card); border: 1.5px solid var(--border-strong);
  border-radius: 6px; padding: 14px; font-size: 0.72rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: .4s ease;
  position: relative;
}
.resume-doc .rline { height: 7px; border-radius: 3px; background: var(--border); margin-bottom: 5px; transition: width .5s ease, background .3s; }
.resume-doc .rline.name { width: 70%; background: var(--accent); height: 9px; }
.resume-doc .rline.highlight { background: var(--accent2); }
.resume-doc .rsection { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }

/* Star/bullet */
.anim-bubble {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 0.85rem; color: var(--text);
  max-width: 280px; line-height: 1.5;
  animation: popIn .3s ease;
  position: relative;
}
@keyframes popIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
.anim-bubble strong { color: var(--accent); }
.anim-items { display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px; }
.anim-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
  font-size: 0.85rem;
  opacity: 0; transform: translateX(-20px);
  transition: opacity .4s, transform .4s;
}
.anim-item.visible { opacity: 1; transform: translateX(0); }
.anim-item-icon { font-size: 1.2rem; }
.anim-item.good { border-color: rgba(16,185,129,0.4); }
.anim-item.bad { border-color: rgba(239,68,68,0.4); }
.anim-item.good .anim-item-icon::before { content: "✅ "; }
.anim-item.bad .anim-item-icon::before { content: "❌ "; }

/* Interview faces */
.interview-scene { display:flex; gap:24px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
.person-card {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  transition: .4s;
}
.person-face {
  width: 70px; height: 70px; border-radius: 50%;
  background: var(--bg-elevated); border: 2px solid var(--border);
  display: grid; place-items: center; font-size: 2.2rem;
  transition: .3s;
}
.person-face.active { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,58,237,0.2); }
.speech-bubble {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; max-width: 180px;
  line-height: 1.5; color: var(--text-secondary); text-align: center;
  transition: .3s; opacity: 0; transform: translateY(6px);
}
.speech-bubble.visible { opacity: 1; transform: translateY(0); }

/* Budget animation */
.budget-bars { display:flex; gap:8px; align-items:flex-end; height:120px; width:100%; max-width:300px; }
.budget-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.budget-bar-col { width:100%; border-radius:6px 6px 0 0; transition:height .6s cubic-bezier(.4,0,.2,1); }
.budget-bar-label { font-size:0.65rem; text-align:center; color:var(--text-muted); font-weight:600; }
.budget-bar-pct { font-size:0.7rem; font-weight:700; }

/* ── GAME AREA ── */
.game-container {
  background: var(--bg-elevated); border-radius: var(--radius-sm);
  padding: 20px; min-height: 200px;
}
.game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.game-title { font-family:var(--font-display); font-weight:700; font-size:1rem; }
.game-score { font-family:var(--font-mono); font-size:0.85rem; color:var(--xp-gold); font-weight:700; }
.game-lives { font-size:1rem; letter-spacing:2px; }

/* Quiz game */
.quiz-question { font-size:1rem; font-weight:600; line-height:1.5; margin-bottom:16px; }
.quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.quiz-opt {
  padding: 12px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-card);
  font-size: 0.9rem; text-align: left; color: var(--text);
  transition: .2s; font-family: var(--font-body);
}
.quiz-opt:hover:not(.disabled) { border-color: var(--accent); background: rgba(124,58,237,0.08); }
.quiz-opt.correct { background: rgba(16,185,129,0.15); border-color: var(--success); color: var(--success); }
.quiz-opt.wrong { background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger); }
.quiz-opt.disabled { cursor: not-allowed; opacity: .7; }
.quiz-feedback {
  margin-top: 14px; padding: 12px 16px; border-radius: 8px;
  font-size: 0.9rem; line-height: 1.5;
  animation: popIn .3s ease;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,.3); color: var(--success); }
.quiz-feedback.wrong { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,.2); color: var(--danger); }
.quiz-nav { display:flex; gap:10px; margin-top:16px; align-items:center; }
.quiz-progress { font-size:0.8rem; color:var(--text-muted); margin-left:auto; font-family:var(--font-mono); }

/* Drag-drop game */
.dragdrop-game { display:flex; flex-direction:column; gap:16px; }
.drag-items { display:flex; gap:8px; flex-wrap:wrap; }
.drag-item {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--bg-card); cursor: grab; font-size: 0.85rem; font-weight: 600;
  transition: .2s; user-select: none;
  color: var(--text);
}
.drag-item:hover { border-color: var(--accent); background: rgba(124,58,237,0.08); }
.drag-item.dragging { opacity: .4; cursor: grabbing; }
.drag-item.placed { opacity: .4; pointer-events: none; }
.drop-zones { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.drop-zone {
  min-height: 80px; border-radius: 8px; border: 2px dashed var(--border);
  padding: 10px; transition: .2s;
  position: relative;
}
.drop-zone-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; }
.drop-zone.dragover { border-color: var(--accent); background: rgba(124,58,237,0.06); }
.drop-zone.correct-zone { border-color: var(--success); background: rgba(16,185,129,0.06); }
.drop-zone.wrong-zone { border-color: var(--danger); }
.dropped-items { display:flex; flex-wrap:wrap; gap:6px; }
.dropped-item {
  padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
  background: var(--accent); color: #fff; cursor: default;
}

/* Salary game */
.salary-game { display:flex; flex-direction:column; gap:14px; }
.salary-scenario { padding: 14px; background: var(--bg-card); border-radius:8px; border:1px solid var(--border); font-size: 0.9rem; line-height: 1.6; }
.salary-choices { display:grid; gap:8px; }
.salary-choice {
  padding:12px 16px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card);
  cursor:pointer; font-size:0.88rem; transition:.2s; color:var(--text); text-align:left; font-family:var(--font-body);
}
.salary-choice:hover:not(.disabled) { border-color:var(--accent); background:rgba(124,58,237,0.07); }
.salary-choice.best { border-color:var(--success); background:rgba(16,185,129,0.1); color:var(--success); }
.salary-choice.ok { border-color:var(--warning); background:rgba(245,158,11,0.1); color:var(--warning); }
.salary-choice.bad { border-color:var(--danger); background:rgba(239,68,68,0.08); color:var(--danger); }

/* Sort / matching game */
.match-game { display:flex; flex-direction:column; gap:12px; }
.match-row { display:flex; gap:12px; align-items:center; }
.match-left { flex:1; padding:10px 14px; background:var(--bg-card); border-radius:8px; border:1px solid var(--border); font-size:.85rem; font-weight:600; }
.match-right {
  flex:1; padding:10px 14px; border-radius:8px; border:2px dashed var(--border);
  font-size:.85rem; min-height:42px; display:flex; align-items:center; cursor:pointer;
  transition:.2s; color:var(--text-muted);
}
.match-right.filled { border-style:solid; border-color:var(--accent); color:var(--text); background:rgba(124,58,237,.07); }
.match-right.correct { border-color:var(--success); background:rgba(16,185,129,.1); color:var(--success); }
.match-right.wrong { border-color:var(--danger); background:rgba(239,68,68,.08); color:var(--danger); }

/* Word scramble */
.scramble-game { display:flex; flex-direction:column; gap:14px; align-items:center; }
.scramble-word {
  font-family: var(--font-mono); font-size: 2rem; font-weight: 700;
  letter-spacing: .2em; color: var(--accent); text-align: center;
}
.scramble-hint { font-size:.85rem; color:var(--text-muted); text-align:center; }
.scramble-input {
  padding: 12px 20px; border-radius: 8px; border: 1.5px solid var(--border-strong);
  background: var(--bg-card); color: var(--text); font-family: var(--font-mono);
  font-size: 1.1rem; text-align: center; letter-spacing: .15em; text-transform: uppercase;
  width: 100%; max-width: 280px; outline: none;
}
.scramble-input:focus { border-color: var(--accent); }
.scramble-input.correct { border-color: var(--success); background: rgba(16,185,129,.1); }
.scramble-input.wrong { border-color: var(--danger); animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* ── GAME RESULT ── */
.game-result {
  display: none; text-align: center; padding: 20px;
  animation: popIn .4s ease;
}
.game-result.show { display: block; }
.result-emoji { font-size: 3rem; margin-bottom: 8px; }
.result-text { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
.result-sub { font-size: .9rem; color: var(--text-secondary); margin-bottom: 16px; }
.xp-earned-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.4);
  color: var(--xp-gold); font-weight: 700; font-size: 1rem;
  padding: 8px 20px; border-radius: 99px; margin-bottom: 16px;
  animation: pulseGold .8s infinite alternate;
}
@keyframes pulseGold { from{box-shadow:0 0 0 0 rgba(245,158,11,.3)} to{box-shadow:0 0 0 8px rgba(245,158,11,0)} }

/* ── CHECKLIST ── */
.checklist { display:flex; flex-direction:column; gap:10px; }
.check-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-card); cursor: pointer; transition: .2s;
  font-size: 0.9rem; line-height: 1.5; color: var(--text);
}
.check-item:hover { border-color: var(--border-strong); }
.check-item.checked { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,.3); }
.check-item .checkmark {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong);
  flex-shrink: 0; display: grid; place-items: center; transition: .2s; margin-top: 1px;
}
.check-item.checked .checkmark { background: var(--success); border-color: var(--success); color: #fff; font-size: .75rem; }
.check-item .check-text { flex: 1; }
.check-item .check-text strong { display: block; font-weight: 600; margin-bottom: 2px; }
.check-item .check-text span { font-size: .82rem; color: var(--text-secondary); }

/* ── KEY TERMS ── */
.terms-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.term-card {
  background: var(--bg-elevated); border-radius:8px; border:1px solid var(--border);
  padding: 14px; cursor: pointer; transition:.2s;
}
.term-card:hover { border-color: var(--accent); }
.term-word { font-weight: 700; font-size: .9rem; margin-bottom: 4px; color: var(--accent); }
.term-def { font-size: .8rem; color: var(--text-secondary); line-height: 1.5; max-height: 0; overflow:hidden; transition:max-height .3s; }
.term-card.open .term-def { max-height: 100px; }
.term-arrow { float: right; color: var(--text-muted); font-size: .8rem; transition: .2s; }
.term-card.open .term-arrow { transform: rotate(180deg); }

/* ── COMPLETION CARD ── */
.completion-card {
  background: linear-gradient(135deg, rgba(124,58,237,.15), rgba(14,165,233,.1));
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 32px 24px; text-align: center;
}
.completion-icon { font-size: 3rem; margin-bottom: 12px; }
.completion-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
.completion-sub { color: var(--text-secondary); font-size: .95rem; margin-bottom: 24px; line-height: 1.6; }
.completion-xp {
  display: inline-flex; gap: 8px; align-items: center;
  font-size: 1.4rem; font-weight: 800; color: var(--xp-gold);
  background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3);
  padding: 10px 24px; border-radius: 99px; margin-bottom: 24px;
}
.btn { padding: 12px 24px; border-radius: 8px; font-family: var(--font-body); font-size: .9rem; font-weight: 600; cursor: pointer; transition: .2s; border: 1px solid; display: inline-flex; align-items:center; gap:6px; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #6B21E0; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-elevated); }
.btn-sm { padding: 8px 16px; font-size: .82rem; }
.btn-full { width: 100%; justify-content: center; }
.btns-row { display:flex; gap:10px; flex-wrap:wrap; }

/* ── NEXT LESSONS ── */
.next-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.next-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; cursor: pointer; transition: .2s;
  text-decoration: none; color: var(--text); display:flex; flex-direction:column; gap:6px;
}
.next-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.next-emoji { font-size: 1.5rem; }
.next-title { font-weight: 700; font-size: .9rem; line-height: 1.3; }
.next-meta { font-size: .78rem; color: var(--text-muted); }
.next-xp { font-size: .78rem; color: var(--xp-gold); font-weight: 700; }

/* ── XP POPUP ── */
.xp-popup {
  position: fixed; bottom: 32px; right: 24px; z-index: 1000;
  background: var(--bg-card); border: 1.5px solid var(--xp-gold);
  border-radius: 12px; padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  pointer-events: none;
  opacity: 0; transform: translateY(20px);
  transition: .4s cubic-bezier(.4,0,.2,1);
}
.xp-popup.show { opacity: 1; transform: translateY(0); }
.xp-popup-num { font-size: 1.4rem; font-weight: 800; color: var(--xp-gold); font-family: var(--font-display); }
.xp-popup-label { font-size: .85rem; color: var(--text-secondary); }

/* ── LEVEL UP OVERLAY ── */
.levelup-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,.7); display: grid; place-items: center;
  opacity: 0; pointer-events: none; transition: .3s;
}
.levelup-overlay.show { opacity: 1; pointer-events: all; }
.levelup-card {
  background: var(--bg-card); border: 2px solid var(--xp-gold);
  border-radius: 20px; padding: 48px 40px; text-align: center;
  box-shadow: 0 0 60px rgba(245,158,11,.3);
  animation: levelUp .6s cubic-bezier(.4,0,.2,1);
  max-width: 360px; width: 90%;
}
@keyframes levelUp { from{transform:scale(.6);opacity:0} 60%{transform:scale(1.05)} to{transform:scale(1);opacity:1} }
.lu-emoji { font-size: 4rem; margin-bottom: 12px; animation: spin 1s ease; }
@keyframes spin { from{transform:rotate(-180deg) scale(.5)} to{transform:rotate(0deg) scale(1)} }
.lu-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: var(--xp-gold); margin-bottom: 6px; }
.lu-sub { color: var(--text-secondary); font-size: .95rem; margin-bottom: 20px; }
.lu-new-skin { font-size: 2rem; margin-bottom: 8px; }
.lu-skin-text { font-size: .85rem; color: var(--text-secondary); margin-bottom: 20px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 24px; left: 24px; z-index: 3000; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast-item {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 12px 16px; font-size: .88rem;
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
  animation: toastIn .3s ease;
  display: flex; align-items: center; gap: 8px;
}
@keyframes toastIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
.toast-item.success { border-color: rgba(16,185,129,.4); }
.toast-item.info { border-color: rgba(14,165,233,.4); }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .quiz-options { grid-template-columns: 1fr; }
  .drop-zones { grid-template-columns: 1fr; }
  .topbar-title { display: none; }
  .terms-grid { grid-template-columns: 1fr; }
  .anim-controls { gap: 6px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <button class="back-btn" onclick="window.history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
    Back
  </button>
  <div class="topbar-sep">·</div>
  <div class="topbar-logo">
    <div class="logo-mark">LP</div>
    <span>LaunchPad<strong style="color:var(--accent)">NYC</strong></span>
  </div>
  <div class="topbar-sep">·</div>
  <div class="topbar-title" id="topbarTitle">Loading lesson…</div>
  <div class="topbar-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <div class="xp-pill" id="xpPill">
      <div class="avatar-circle" id="topAvatarCircle">
        <span class="avatar-emoji" id="topAvatarEmoji">🌱</span>
      </div>
      <div class="xp-info">
        <span class="xp-level" id="xpLevelLabel">Level 1</span>
        <div class="xp-bar-mini"><div class="xp-bar-fill" id="xpBarMini" style="width:0%"></div></div>
      </div>
    </div>
  </div>
</header>

<!-- PROGRESS BAR -->
<div class="lesson-progress-bar"><div class="lesson-progress-fill" id="lessonProgress"></div></div>

<!-- AVATAR PANEL -->
<div class="avatar-panel" id="avatarPanel">
  <div class="ap-title">🏆 My Avatar</div>
  <div class="ap-avatar-big" id="apAvatarBig">
    <span id="apAvatarEmoji">🌱</span>
    <div class="ap-avatar-ring" id="apAvatarRing"></div>
  </div>
  <div class="ap-name" id="apName">Rookie Worker</div>
  <div class="ap-level-text" id="apLevelText">Level 1 · 0 / 100 XP</div>
  <div class="ap-xp-bar"><div class="ap-xp-fill" id="apXpFill" style="width:0%"></div></div>
  <div class="ap-xp-label" id="apXpLabel">0 / 100 XP to Level 2</div>
  <div class="ap-unlockables">
    <div class="ap-unlock-title">Avatar Skins — Unlock with XP</div>
    <div class="ap-skins" id="apSkins"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="lesson-layout" id="lessonLayout">
  <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">
    <div style="font-size:2rem; margin-bottom:12px">⏳</div>
    <div>Loading lesson…</div>
  </div>
</main>

<!-- XP POPUP -->
<div class="xp-popup" id="xpPopup">
  <div style="font-size:1.5rem">⭐</div>
  <div>
    <div class="xp-popup-num" id="xpPopupNum">+50 XP</div>
    <div class="xp-popup-label" id="xpPopupLabel">Lesson completed!</div>
  </div>
</div>

<!-- LEVEL UP OVERLAY -->
<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-card">
    <div class="lu-emoji">🏆</div>
    <div class="lu-title" id="luTitle">Level Up!</div>
    <div class="lu-sub" id="luSub">You reached Level 2!</div>
    <div class="lu-new-skin" id="luNewSkin"></div>
    <div class="lu-skin-text" id="luSkinText"></div>
    <button class="btn btn-primary btn-full" onclick="document.getElementById('levelupOverlay').classList.remove('show')">Awesome! 🎉</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
